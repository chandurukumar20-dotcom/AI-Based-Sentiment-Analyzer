{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}
{% block page_title %}Error 500{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold text-dark mb-2">Internal Server Error</h3>
    <p class="text-muted mb-4">{{ error or "An unexpected server error occurred while processing your request." }}</p>
    <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary px-4">
        <i class="bi bi-house-door-fill me-1"></i>Return to Home
    </a>
</div>
{% endblock %}
