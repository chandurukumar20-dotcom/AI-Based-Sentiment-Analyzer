{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}
{% block page_title %}Error 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-muted mb-2">404</div>
    <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The page or resource you are looking for does not exist.</p>
    <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary px-4">
        <i class="bi bi-house-door-fill me-1"></i>Return to Home
    </a>
</div>
{% endblock %}
